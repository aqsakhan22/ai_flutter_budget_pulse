name: BudgetPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows triggering manually from the GitHub UI

jobs:
  # ==========================================
  # JOB 1: Static Analysis, Codegen & Unit Tests
  # ==========================================
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file from GitHub Secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Hive Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

  # ==========================================
  # JOB 2: Build Android Release APK & AppBundle
  # ==========================================
  # ==========================================
  # JOB 2: Build Android Signed Release Bundle
  # ==========================================
  build_android:
    name: Build Android Signed Release
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies & Generate Adapters
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # ---> ADD YOUR KEYSTONE STEPS HERE <---
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Build Signed App Bundle (.aab)
        env:
          KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --no-pub

      - name: Upload Signed AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-pulse-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # ==========================================
  # JOB 3: Deploy iOS to TestFlight (Paste here!)
  # ==========================================
  deploy_ios_testflight:
    name: Deploy to TestFlight
    needs: analyze_and_test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies & Generate Code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Build and Upload to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          cd ios
          bundle exec fastlane beta