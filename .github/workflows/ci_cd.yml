name: BudgetPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows triggering manually from the GitHub UI

jobs:
  # ==========================================
  # JOB 1: Static Analysis, Codegen & Unit Tests
  # ==========================================
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file from GitHub Secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Hive Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Widget Tests
        run: flutter test

  # ==========================================
  # JOB 2: Build Android Release APK & AppBundle
  # ==========================================
  build_android:
    name: Build Android Release
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies & Generate Adapters
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK (with Tree-Shaking & Obfuscation)
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: budget-pulse-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # JOB 3: Build Unsigned iOS Release
  # ==========================================
  build_ios:
    name: Build iOS Release (Unsigned)
    needs: analyze_and_test
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject .env File
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Install Dependencies & Generate Adapters
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign